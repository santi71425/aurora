name: Jarvis - compilar y probar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK oficial de Android
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Pruebas, compilación y verificación de firma
        run: python3 build.py
      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: |
            dist/Jarvis-0.3.1.apk
            dist/Jarvis-0.3.1.apk.sha256
            dist/build-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Habilitar aceleración del emulador
        run: sudo chmod a+rw /dev/kvm
      - name: Instalar y probar en Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: python3 ci_smoke.py
      - name: Guardar resultado y captura del emulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-pruebas-emulador
          path: dist/emulator-*
          if-no-files-found: ignore
          retention-days: 30
